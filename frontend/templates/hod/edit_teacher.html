{% extends "layout.html" %}
{% block title %}Edit Teacher — Attendify{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <!-- Header -->
    <div class="mb-8 flex items-center justify-between">
        <div>
            <h1 class="text-2xl font-black text-gray-900">Edit Teacher</h1>
            <p class="text-sm text-gray-500 mt-1">Update information for <span class="font-bold text-indigo-600">{{ teacher.full_name }}</span></p>
        </div>
        <a href="{{ url_for('hod.dashboard') }}" class="text-gray-500 hover:text-gray-700 text-sm font-medium flex items-center gap-1 transition-colors">
            <i class="fa-solid fa-arrow-left"></i> Back to Dashboard
        </a>
    </div>

    <!-- Form Card -->
    <div class="section-card p-8">
        <form method="POST" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Full Name -->
                <div class="md:col-span-2">
                    <label for="full_name" class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2">Full Name</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                            <i class="fa-solid fa-user text-sm"></i>
                        </div>
                        <input type="text" id="full_name" name="full_name" required value="{{ teacher.full_name }}"
                               class="block w-full pl-10 pr-3 py-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all"
                               placeholder="e.g. Prof. Jane Doe">
                    </div>
                </div>

                <!-- Username (ReadOnly) -->
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Username (Not Editable)</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-300">
                            <i class="fa-solid fa-at text-sm"></i>
                        </div>
                        <input type="text" value="{{ teacher.username }}" disabled
                               class="block w-full pl-10 pr-3 py-2.5 bg-gray-50 border border-gray-100 rounded-xl text-sm text-gray-400 cursor-not-allowed">
                    </div>
                </div>

                <!-- Email -->
                <div>
                    <label for="email" class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2">Email Address</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                            <i class="fa-solid fa-envelope text-sm"></i>
                        </div>
                        <input type="email" id="email" name="email" value="{{ teacher.email or '' }}"
                               class="block w-full pl-10 pr-3 py-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all"
                               placeholder="jane.doe@college.edu">
                    </div>
                </div>

                <!-- Status -->
                <div class="md:col-span-2 flex items-center gap-3 bg-gray-50 p-4 rounded-xl border border-gray-100">
                    <div class="relative inline-block w-10 h-5 align-middle select-none transition duration-200 ease-in">
                        <input type="checkbox" name="is_active" id="is_active" {% if teacher.is_active %}checked{% endif %}
                               class="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-4 appearance-none cursor-pointer"/>
                        <label for="is_active" class="toggle-label block overflow-hidden h-5 rounded-full bg-gray-300 cursor-pointer"></label>
                    </div>
                    <label for="is_active" class="text-sm font-bold text-gray-700">Account Active Status</label>
                    <p class="text-xs text-gray-500 ml-auto">Inactivating will prevent teacher login.</p>
                </div>

                <div class="md:col-span-2 pt-4 border-t border-gray-50">
                    <h3 class="text-sm font-bold text-gray-900 mb-4">Change Password <span class="text-xs font-normal text-gray-400">(Leave blank to keep current)</span></h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label for="password" class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2">New Password</label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                                    <i class="fa-solid fa-lock text-sm"></i>
                                </div>
                                <input type="password" id="password" name="password"
                                       class="block w-full pl-10 pr-3 py-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all">
                            </div>
                        </div>
                        <div>
                            <label for="confirm_password" class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2">Confirm Password</label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                                    <i class="fa-solid fa-check-double text-sm"></i>
                                </div>
                                <input type="password" id="confirm_password" name="confirm_password"
                                       class="block w-full pl-10 pr-3 py-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="pt-6">
                <button type="submit"
                        class="w-full grad-primary text-white font-black py-3 px-4 rounded-xl shadow-lg shadow-indigo-200 hover:shadow-xl hover:-translate-y-0.5 transition-all focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
                    Update Teacher Details
                </button>
            </div>
        </form>
    </div>
</div>

<style>
/* Custom toggle switch styles if not using Tailwind forms plugin */
.toggle-checkbox:checked {
  right: 0;
  border-color: #6366f1;
}
.toggle-checkbox:checked + .toggle-label {
  background-color: #6366f1;
}
.toggle-checkbox {
  right: 1.25rem;
  transition: all 0.3s;
  border: 4px solid #fff;
}
.toggle-label {
    transition: background-color 0.3s;
}
</style>
{% endblock %}
