{% extends "layout.html" %}
{% block title %}Edit Schedule — Attendify{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto">
    <!-- Header -->
    <div class="mb-8 flex items-center justify-between">
        <div>
            <h1 class="text-2xl font-black text-gray-900">Edit Class Schedule</h1>
            <p class="text-sm text-gray-500 mt-1">Modify the timetable entry for your department.</p>
        </div>
        <a href="{{ url_for('hod.manage_schedules') }}" class="text-gray-500 hover:text-gray-700 text-sm font-medium flex items-center gap-1 transition-colors">
            <i class="fa-solid fa-arrow-left"></i> Back to Schedules
        </a>
    </div>

    <!-- Form Card -->
    <div class="section-card p-8">
        <form method="POST" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Subject -->
                <div>
                    <label for="subject_id" class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2">Subject</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                            <i class="fa-solid fa-book text-sm"></i>
                        </div>
                        <select id="subject_id" name="subject_id" required
                                class="block w-full pl-10 pr-3 py-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all appearance-none bg-white">
                            <option value="">Select Subject</option>
                            {% for subj in subjects %}
                                <option value="{{ subj.subject_id }}" {% if schedule.subject_id | int == subj.subject_id %}selected{% endif %}>
                                    {{ subj.subject_name }} ({{ subj.subject_code }})
                                </option>
                            {% endfor %}
                        </select>
                        <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-gray-400">
                            <i class="fa-solid fa-chevron-down text-xs"></i>
                        </div>
                    </div>
                </div>

                <!-- Teacher -->
                <div>
                    <label for="teacher_id" class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2">Teacher</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                            <i class="fa-solid fa-chalkboard-user text-sm"></i>
                        </div>
                        <select id="teacher_id" name="teacher_id" required
                                class="block w-full pl-10 pr-3 py-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all appearance-none bg-white">
                            <option value="">Select Teacher</option>
                            {% for t in teachers %}
                                <option value="{{ t.user_id }}" {% if schedule.teacher_id | int == t.user_id %}selected{% endif %}>
                                    {{ t.full_name }}
                                </option>
                            {% endfor %}
                        </select>
                        <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-gray-400">
                            <i class="fa-solid fa-chevron-down text-xs"></i>
                        </div>
                    </div>
                </div>

                <!-- Division -->
                <div>
                    <label for="division" class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2">Division</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                            <i class="fa-solid fa-users text-sm"></i>
                        </div>
                        <input type="text" id="division" name="division" required value="{{ schedule.division }}" maxlength="10"
                               class="block w-full pl-10 pr-3 py-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all uppercase"
                               placeholder="e.g. A">
                    </div>
                </div>

                <!-- Academic Year -->
                <div>
                    <label for="academic_year" class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2">Academic Year / Class</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                            <i class="fa-solid fa-graduation-cap text-sm"></i>
                        </div>
                        <select id="academic_year" name="academic_year" required
                                class="block w-full pl-10 pr-3 py-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all appearance-none bg-white">
                            <option value="FE" {% if schedule.academic_year == 'FE' %}selected{% endif %}>First Year (FE)</option>
                            <option value="SE" {% if schedule.academic_year == 'SE' %}selected{% endif %}>Second Year (SE)</option>
                            <option value="TE" {% if schedule.academic_year == 'TE' %}selected{% endif %}>Third Year (TE)</option>
                            <option value="BE" {% if schedule.academic_year == 'BE' %}selected{% endif %}>Final Year (BE)</option>
                            {% if schedule.academic_year and schedule.academic_year not in ['FE', 'SE', 'TE', 'BE'] %}
                            <option value="{{ schedule.academic_year }}" selected>{{ schedule.academic_year }}</option>
                            {% endif %}
                        </select>
                        <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-gray-400">
                            <i class="fa-solid fa-chevron-down text-xs"></i>
                        </div>
                    </div>
                </div>

                <!-- Day of Week -->
                <div>
                    <label for="day_of_week" class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2">Day of Week</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                            <i class="fa-solid fa-calendar-day text-sm"></i>
                        </div>
                        <select id="day_of_week" name="day_of_week" required
                                class="block w-full pl-10 pr-3 py-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all appearance-none bg-white">
                            {% for i in range(days|length) %}
                                <option value="{{ i }}" {% if schedule.day_of_week | int == i %}selected{% endif %}>{{ days[i] }}</option>
                            {% endfor %}
                        </select>
                        <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-gray-400">
                            <i class="fa-solid fa-chevron-down text-xs"></i>
                        </div>
                    </div>
                </div>

                <!-- Classroom -->
                <div>
                    <label for="classroom" class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2">Classroom (Optional)</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                            <i class="fa-solid fa-door-open text-sm"></i>
                        </div>
                        <input type="text" id="classroom" name="classroom" value="{{ schedule.classroom or '' }}" maxlength="50"
                               class="block w-full pl-10 pr-3 py-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all"
                               placeholder="e.g. Room 101">
                    </div>
                </div>

                <!-- Start Time -->
                <div>
                    <label for="start_time" class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2">Start Time</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                            <i class="fa-solid fa-clock text-sm"></i>
                        </div>
                        <input type="time" id="start_time" name="start_time" required value="{{ schedule.start_time }}"
                               class="block w-full pl-10 pr-3 py-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all">
                    </div>
                </div>

                <!-- End Time -->
                <div>
                    <label for="end_time" class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2">End Time</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                            <i class="fa-solid fa-clock text-sm"></i>
                        </div>
                        <input type="time" id="end_time" name="end_time" required value="{{ schedule.end_time }}"
                               class="block w-full pl-10 pr-3 py-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all">
                    </div>
                </div>

                <!-- Status -->
                <div class="md:col-span-2 flex items-center gap-3 bg-gray-50 p-4 rounded-xl border border-gray-100">
                    <div class="relative inline-block w-10 h-5 align-middle select-none transition duration-200 ease-in">
                        <input type="checkbox" name="is_active" id="is_active" {% if schedule.is_active %}checked{% endif %}
                               class="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-4 appearance-none cursor-pointer"/>
                        <label for="is_active" class="toggle-label block overflow-hidden h-5 rounded-full bg-gray-300 cursor-pointer"></label>
                    </div>
                    <label for="is_active" class="text-sm font-bold text-gray-700">Schedule Active Status</label>
                </div>
            </div>

            <div class="pt-6">
                <button type="submit"
                        class="w-full grad-primary text-white font-black py-3 px-4 rounded-xl shadow-lg shadow-indigo-200 hover:shadow-xl hover:-translate-y-0.5 transition-all focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
                    Update Schedule
                </button>
            </div>
        </form>
    </div>
</div>

<style>
.toggle-checkbox:checked {
  right: 0;
  border-color: #6366f1;
}
.toggle-checkbox:checked + .toggle-label {
  background-color: #6366f1;
}
.toggle-checkbox {
  right: 1.25rem;
  transition: all 0.3s;
  border: 4px solid #fff;
}
.toggle-label {
    transition: background-color 0.3s;
}
</style>
{% endblock %}
