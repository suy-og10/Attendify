{% extends "layout.html" %}
{% block title %}Department Reports — Attendify{% endblock %}

{% block content %}
<!-- Header -->
<div class="animated-gradient rounded-2xl p-7 mb-7 relative overflow-hidden shadow-xl">
    <div class="absolute top-0 right-0 w-56 h-56 bg-white/10 rounded-full blur-3xl -translate-y-1/2 translate-x-1/4"></div>
    <div class="absolute bottom-0 left-1/3 w-40 h-40 bg-purple-300/20 rounded-full blur-2xl translate-y-1/2"></div>
    <div class="relative z-10 flex items-center gap-4">
        <div class="w-14 h-14 bg-white/20 rounded-2xl flex items-center justify-center flex-shrink-0">
            <i class="fa-solid fa-chart-line text-white text-2xl"></i>
        </div>
        <div>
            <h1 class="text-2xl font-black text-white">Department Attendance Reports</h1>
            <p class="text-purple-200 text-sm mt-0.5">Generate and export detailed attendance analytics</p>
        </div>
    </div>
</div>

<div class="max-w-5xl mx-auto">
    <div class="section-card p-8">
        <div class="flex items-center gap-3 mb-8">
            <div class="w-10 h-10 grad-rose rounded-xl flex items-center justify-center shadow">
                <i class="fa-solid fa-file-export text-white"></i>
            </div>
            <div>
                <h2 class="text-lg font-bold text-gray-900">Report Configuration</h2>
                <p class="text-xs text-gray-500">Configure filters to generate your Excel report</p>
            </div>
        </div>

        <form method="POST" class="space-y-8">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Date Range Section -->
                <div class="space-y-4 lg:col-span-2 grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="space-y-2">
                        <label for="start_date" class="block text-xs font-bold text-gray-700 uppercase tracking-wider">Start Date</label>
                        <div class="relative">
                            <i class="fa-solid fa-calendar-day absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                            <input type="date" id="start_date" name="start_date" required
                                class="w-full pl-10 pr-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-rose-500 transition-all text-sm">
                        </div>
                    </div>
                    <div class="space-y-2">
                        <label for="end_date" class="block text-xs font-bold text-gray-700 uppercase tracking-wider">End Date</label>
                        <div class="relative">
                            <i class="fa-solid fa-calendar-check absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                            <input type="date" id="end_date" name="end_date" required
                                class="w-full pl-10 pr-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-rose-500 transition-all text-sm">
                        </div>
                    </div>
                </div>

                <!-- Subject Filter -->
                <div class="space-y-2">
                    <label for="subject_id" class="block text-xs font-bold text-gray-700 uppercase tracking-wider">Subject (Optional)</label>
                    <div class="relative">
                        <i class="fa-solid fa-book absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        <select id="subject_id" name="subject_id"
                            class="w-full pl-10 pr-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-rose-500 transition-all text-sm appearance-none">
                            <option value="all">All Subjects</option>
                            {% for subject in subjects %}
                            <option value="{{ subject.subject_id }}">{{ subject.subject_name }} ({{ subject.subject_code }})</option>
                            {% endfor %}
                        </select>
                        <i class="fa-solid fa-chevron-down absolute right-3 top-1/2 -translate-y-1/2 text-gray-300 pointer-events-none text-xs"></i>
                    </div>
                </div>

                <!-- Division Filter -->
                <div class="space-y-2">
                    <label for="division" class="block text-xs font-bold text-gray-700 uppercase tracking-wider">Division (Optional)</label>
                    <div class="relative">
                        <i class="fa-solid fa-users-rectangle absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        <select id="division" name="division"
                            class="w-full pl-10 pr-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-rose-500 transition-all text-sm appearance-none">
                            <option value="all">All Divisions</option>
                            {% for div in divisions %}
                            <option value="{{ div.division }}">Division {{ div.division }}</option>
                            {% endfor %}
                        </select>
                        <i class="fa-solid fa-chevron-down absolute right-3 top-1/2 -translate-y-1/2 text-gray-300 pointer-events-none text-xs"></i>
                    </div>
                </div>

                <!-- Year Filter -->
                <div class="space-y-2">
                    <label for="academic_year" class="block text-xs font-bold text-gray-700 uppercase tracking-wider">Academic Year (Optional)</label>
                    <div class="relative">
                        <i class="fa-solid fa-graduation-cap absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        <select id="academic_year" name="academic_year"
                            class="w-full pl-10 pr-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-rose-500 transition-all text-sm appearance-none">
                            <option value="all">All Years</option>
                            {% for year in academic_years %}
                            <option value="{{ year.academic_year }}">{{ year.academic_year }}</option>
                            {% endfor %}
                        </select>
                        <i class="fa-solid fa-chevron-down absolute right-3 top-1/2 -translate-y-1/2 text-gray-300 pointer-events-none text-xs"></i>
                    </div>
                </div>

                <!-- Teacher Filter -->
                <div class="space-y-2">
                    <label for="teacher_id" class="block text-xs font-bold text-gray-700 uppercase tracking-wider">Teacher (Optional)</label>
                    <div class="relative">
                        <i class="fa-solid fa-chalkboard-user absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        <select id="teacher_id" name="teacher_id"
                            class="w-full pl-10 pr-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-rose-500 transition-all text-sm appearance-none">
                            <option value="all">All Teachers</option>
                            {% for teacher in teachers %}
                            <option value="{{ teacher.user_id }}">{{ teacher.full_name }}</option>
                            {% endfor %}
                        </select>
                        <i class="fa-solid fa-chevron-down absolute right-3 top-1/2 -translate-y-1/2 text-gray-300 pointer-events-none text-xs"></i>
                    </div>
                </div>
            </div>

            <div class="flex items-center justify-center pt-6">
                <button type="submit"
                    class="w-full md:w-auto px-12 py-4 bg-rose-600 hover:bg-rose-700 text-white font-black rounded-xl shadow-lg shadow-rose-100 hover:shadow-rose-200 hover:-translate-y-0.5 transition-all flex items-center justify-center gap-3">
                    <i class="fa-solid fa-file-excel text-xl"></i>
                    Generate Excel Report
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
