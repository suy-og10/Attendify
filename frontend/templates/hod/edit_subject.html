{% extends "layout.html" %}
{% block title %}Edit Subject — Attendify{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto">
    <!-- Header -->
    <div class="mb-8 flex items-center justify-between">
        <div>
            <h1 class="text-2xl font-black text-gray-900">Edit Subject</h1>
            <p class="text-sm text-gray-500 mt-1">Updating <span class="font-bold text-indigo-600">{{ subject.subject_name }}</span> ({{ subject.subject_code }})</p>
        </div>
        <a href="{{ url_for('hod.manage_subjects') }}" class="text-gray-500 hover:text-gray-700 text-sm font-medium flex items-center gap-1 transition-colors">
            <i class="fa-solid fa-arrow-left"></i> Back to Subjects
        </a>
    </div>

    <!-- Form Card -->
    <div class="section-card p-8">
        <form method="POST" class="space-y-6">
            <div class="space-y-4">
                <!-- Subject Code -->
                <div>
                    <label for="subject_code" class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2">Subject Code</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                            <i class="fa-solid fa-hashtag text-sm"></i>
                        </div>
                        <input type="text" id="subject_code" name="subject_code" required value="{{ subject.subject_code }}"
                               class="block w-full pl-10 pr-3 py-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all uppercase"
                               placeholder="e.g. CS-101">
                    </div>
                </div>

                <!-- Subject Name -->
                <div>
                    <label for="subject_name" class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2">Subject Name</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                            <i class="fa-solid fa-book-open text-sm"></i>
                        </div>
                        <input type="text" id="subject_name" name="subject_name" required value="{{ subject.subject_name }}"
                               class="block w-full pl-10 pr-3 py-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all"
                               placeholder="e.g. Data Structures & Algorithms">
                    </div>
                </div>

                <!-- Semester -->
                <div>
                    <label for="semester" class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2">Semester</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                            <i class="fa-solid fa-layer-group text-sm"></i>
                        </div>
                        <select id="semester" name="semester" required
                                class="block w-full pl-10 pr-3 py-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all appearance-none">
                            {% for i in range(1, 9) %}
                            <option value="{{ i }}" {% if subject.semester == i %}selected{% endif %}>Semester {{ i }}</option>
                            {% endfor %}
                        </select>
                        <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-gray-400">
                            <i class="fa-solid fa-chevron-down text-xs"></i>
                        </div>
                    </div>
                </div>

                <!-- Status -->
                <div class="flex items-center gap-3 bg-gray-50 p-4 rounded-xl border border-gray-100">
                    <div class="relative inline-block w-10 h-5 align-middle select-none transition duration-200 ease-in">
                        <input type="checkbox" name="is_active" id="is_active" {% if subject.is_active %}checked{% endif %}
                               class="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-4 appearance-none cursor-pointer"/>
                        <label for="is_active" class="toggle-label block overflow-hidden h-5 rounded-full bg-gray-300 cursor-pointer"></label>
                    </div>
                    <label for="is_active" class="text-sm font-bold text-gray-700">Subject Active Status</label>
                </div>
            </div>

            <div class="pt-6">
                <button type="submit"
                        class="w-full grad-primary text-white font-black py-3 px-4 rounded-xl shadow-lg shadow-indigo-200 hover:shadow-xl hover:-translate-y-0.5 transition-all focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
                    Save Changes
                </button>
            </div>
        </form>
    </div>
</div>

<style>
.toggle-checkbox:checked {
  right: 0;
  border-color: #6366f1;
}
.toggle-checkbox:checked + .toggle-label {
  background-color: #6366f1;
}
.toggle-checkbox {
  right: 1.25rem;
  transition: all 0.3s;
  border: 4px solid #fff;
}
.toggle-label {
    transition: background-color 0.3s;
}
</style>
{% endblock %}
