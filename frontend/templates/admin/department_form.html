{% extends "layout.html" %}
{% block title %}Edit Department - Attendify{% endblock %}

{% block content %}
<div class="section-card p-6 max-w-2xl mx-auto">
    <h1 class="text-xl font-black text-gray-900 mb-5">Edit Department</h1>
    <form method="POST" class="space-y-4">
        <div>
            <label class="block text-xs font-bold text-gray-500 mb-1">Department Name</label>
            <input name="dept_name" value="{{ dept.dept_name }}" class="input-field !pl-3" required>
        </div>
        <div>
            <label class="block text-xs font-bold text-gray-500 mb-1">Department Code</label>
            <input name="dept_code" value="{{ dept.dept_code }}" class="input-field !pl-3" required>
        </div>
        <div class="flex gap-3">
            <button class="btn-primary">Save Changes</button>
            <a href="{{ url_for('admin.departments') }}" class="px-5 py-3 rounded-lg bg-gray-100 text-gray-700 font-bold">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
