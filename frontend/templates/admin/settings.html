{% extends "layout.html" %}
{% block title %}System Settings - Attendify{% endblock %}

{% block content %}
<div class="animated-gradient rounded-2xl p-7 mb-7 shadow-xl">
    <h1 class="text-2xl font-black text-white">System Settings</h1>
    <p class="text-purple-200 text-sm mt-0.5">Institute rules used by attendance and LMS workflows</p>
</div>

<div class="section-card p-6 max-w-3xl">
    <form method="POST" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
            <label class="block text-xs font-bold text-gray-500 mb-1">Attendance Threshold (%)</label>
            <input name="attendance_threshold" value="{{ settings.attendance_threshold }}" class="input-field !pl-3" type="number" min="0" max="100">
        </div>
        <div>
            <label class="block text-xs font-bold text-gray-500 mb-1">Late After Minutes</label>
            <input name="late_after_minutes" value="{{ settings.late_after_minutes }}" class="input-field !pl-3" type="number" min="0">
        </div>
        <div>
            <label class="block text-xs font-bold text-gray-500 mb-1">Auto-close Session Minutes</label>
            <input name="auto_close_minutes" value="{{ settings.auto_close_minutes }}" class="input-field !pl-3" type="number" min="1">
        </div>
        <div>
            <label class="block text-xs font-bold text-gray-500 mb-1">Face Similarity Threshold</label>
            <input name="face_similarity_threshold" value="{{ settings.face_similarity_threshold }}" class="input-field !pl-3" type="number" step="0.01" min="0" max="1">
        </div>
        <div>
            <label class="block text-xs font-bold text-gray-500 mb-1">Biometric Consent Required</label>
            <select name="biometric_consent_required" class="input-field !pl-3">
                <option value="1" {% if settings.biometric_consent_required == '1' %}selected{% endif %}>Yes</option>
                <option value="0" {% if settings.biometric_consent_required == '0' %}selected{% endif %}>No</option>
            </select>
        </div>
        <div class="md:col-span-2">
            <button class="btn-primary"><i class="fa-solid fa-floppy-disk mr-1"></i>Save Settings</button>
        </div>
    </form>
</div>
{% endblock %}
